name: CI

# Commit message skip tokens (push only): [skip_tests], [skip ci], [ci skip]

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [upstream-changed]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test execution'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
  BLVM_BUILD_TARGET: ${{ github.workspace }}/.build/gh-blvm-miniscript-build/${{ github.run_id }}/target

jobs:
  setup:
    name: Setup
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      github.event_name != 'push' || github.event.head_commit == null ||
      (!contains(github.event.head_commit.message, '[skip ci]') &&
       !contains(github.event.head_commit.message, '[ci skip]') &&
       !contains(github.event.head_commit.message, '[no ci]'))
    outputs:
      cache-key: ${{ steps.setup-cache.outputs.cache-key }}
    steps:
      - name: Pre-flight disk cleanup
        run: |
          if [ -d "${{ github.workspace }}/.build/gh-blvm-miniscript-build" ]; then
            find "${{ github.workspace }}/.build/gh-blvm-miniscript-build" -mindepth 1 -maxdepth 1 -type d \
              -not -name "${{ github.run_id }}" -mmin +60 \
              -exec rm -rf {} + 2>/dev/null || true
          fi

      - uses: actions/checkout@v4

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Cache key
        id: setup-cache
        run: |
          CACHE_ROOT="${{ github.workspace }}/.build/runner-cache"
          DEPS_KEY=$(sha256sum Cargo.toml | cut -d' ' -f1)
          CACHE_KEY="${DEPS_KEY}"
          echo "cache-key=$CACHE_KEY" >> $GITHUB_OUTPUT
          mkdir -p "$CACHE_ROOT/cargo/$CACHE_KEY"/{registry,git} "$CACHE_ROOT/target/$CACHE_KEY"

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

  build:
    name: Build
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]
    steps:
      - uses: actions/checkout@v4

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Install system deps
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Qq openssl pkgconf >/dev/null 2>&1 || sudo pacman -Sy --noconfirm openssl pkgconf
          fi

      - name: Isolate CARGO_HOME
        run: |
          mkdir -p "${RUNNER_TEMP}/cargo"
          echo "CARGO_HOME=${RUNNER_TEMP}/cargo" >> "$GITHUB_ENV"

      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      - name: Build and compile tests
        env:
          CARGO_TARGET_DIR: ${{ env.BLVM_BUILD_TARGET }}
        run: cargo test --no-run

      - name: Save Cargo cache
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: save

      - name: Prune old runner caches
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: prune

  test:
    name: Test
    needs: [setup, build]
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      github.event_name != 'push' || github.event.head_commit == null ||
      (!contains(github.event.head_commit.message, '[skip_tests]') &&
       !contains(github.event.head_commit.message, '[skip ci]'))
    steps:
      - uses: actions/checkout@v4

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Install system deps
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Qq openssl pkgconf >/dev/null 2>&1 || sudo pacman -Sy --noconfirm openssl pkgconf
          fi

      - name: Isolate CARGO_HOME
        run: |
          mkdir -p "${RUNNER_TEMP}/cargo"
          echo "CARGO_HOME=${RUNNER_TEMP}/cargo" >> "$GITHUB_ENV"

      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      - name: Run tests
        env:
          CARGO_TARGET_DIR: ${{ env.BLVM_BUILD_TARGET }}
        run: cargo test

  clippy:
    name: Clippy + fmt
    needs: [setup, build]
    runs-on: [self-hosted, Linux, X64, builds]
    steps:
      - uses: actions/checkout@v4

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Install system deps
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Qq openssl pkgconf >/dev/null 2>&1 || sudo pacman -Sy --noconfirm openssl pkgconf
          fi

      - name: Isolate CARGO_HOME
        run: |
          mkdir -p "${RUNNER_TEMP}/cargo"
          echo "CARGO_HOME=${RUNNER_TEMP}/cargo" >> "$GITHUB_ENV"

      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      - name: rustfmt
        env:
          CARGO_TARGET_DIR: ${{ env.BLVM_BUILD_TARGET }}
        run: cargo fmt --all -- --check

      - name: clippy
        env:
          CARGO_TARGET_DIR: ${{ env.BLVM_BUILD_TARGET }}
        run: |
          CARGO_INCREMENTAL=0 cargo clippy --bins --tests \
            -- -D clippy::uninlined_format_args -D warnings

  release:
    name: Release
    needs: [build, test, clippy]
    runs-on: [self-hosted, Linux, X64, builds]
    permissions:
      contents: write
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      needs.clippy.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.event.head_commit == null ||
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[skip release]')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version and push tag
        # Pushing a v* tag triggers release.yml which builds all platforms.
        # IMPORTANT: must use a PAT (REGISTRY_UPDATE_TOKEN), not GITHUB_TOKEN —
        # GitHub Actions silently ignores tag pushes made with GITHUB_TOKEN and
        # will not trigger release.yml.
        env:
          PAT: ${{ secrets.REGISTRY_UPDATE_TOKEN }}
        run: |
          CURRENT=$(grep -A 5 '^\[package\]' Cargo.toml | grep '^version = ' | head -1 | sed -E 's/^version = "([^"]+)".*/\1/')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          EXISTING_TAGS=$(git tag -l "v*" | sed 's/^v//' || true)
          PATCH=$((PATCH + 1))
          for i in $(seq 0 20); do
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            if echo "$EXISTING_TAGS" | grep -qxF "$VERSION"; then
              PATCH=$((PATCH + 1))
            else
              break
            fi
          done
          VERSION_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Use PAT so the push triggers release.yml (GITHUB_TOKEN pushes are ignored)
          git remote set-url origin "https://x-access-token:${PAT}@github.com/BTCDecoded/blvm-miniscript.git"
          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "⚠️  Tag ${VERSION_TAG} already exists — release.yml already ran or is running"
          else
            git tag -a "$VERSION_TAG" -m "Release ${VERSION_TAG}"
            git push origin "$VERSION_TAG"
            echo "✅ Pushed tag ${VERSION_TAG} — release.yml will build all platforms"
          fi
